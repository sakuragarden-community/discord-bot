services:
  discord-bot:
    image: node:22-bookworm
    container_name: kodama-discord-bot-dev
    restart: unless-stopped
    init: true
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ${PROJECT_PATH:-/var/www/kodama-nest/discord-bot}:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Rome
      HOME: /tmp
    command: >
      sh -c "[ -d node_modules ] || npm install;
             exec sleep infinity"
    networks: [default, kodama-nest]

  networks:
    kodama-nest:
      external: true